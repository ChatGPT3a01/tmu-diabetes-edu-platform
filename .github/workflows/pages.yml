# GitHub Pages 只做「轉址」：正式網站統一在 Netlify（https://tmu-diabetes-edu.netlify.app）
name: Redirect GitHub Pages to Netlify
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir _site
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://tmu-diabetes-edu.netlify.app/">
          <link rel="canonical" href="https://tmu-diabetes-edu.netlify.app/"><title>糖尿病互動衛教平台</title></head>
          <body><p>網站已搬家，正在前往 <a href="https://tmu-diabetes-edu.netlify.app/">https://tmu-diabetes-edu.netlify.app/</a></p></body></html>
          HTML
          cp _site/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
