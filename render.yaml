# Render Blueprint：後端（API＋研究者後臺＋資料庫）
# 一鍵部署：https://render.com/deploy?repo=https://github.com/ChatGPT3a01/tmu-diabetes-edu-platform
services:
  - type: web
    name: tmu-diabetes-edu
    runtime: node
    region: singapore
    plan: starter            # 研究資料需永久磁碟，Render 免費方案不支援磁碟（重啟即遺失資料）
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    disk:
      name: research-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: ALLOWED_ORIGINS
        value: https://chatgpt3a01.github.io
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: LLM_PROVIDER
        value: local
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD     # 建立時由您在 Render 畫面輸入（至少 10 碼、含英文與數字），不寫進程式碼
        sync: false
